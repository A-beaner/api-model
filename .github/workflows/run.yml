name: train-model

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'models/**'
      - 'metrics.json'
      - 'track_record.csv'
      - 'LEARNING.md'
      - 'strategy_state.json'
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * 1-5"  # weekdays 19:30 UTC = 3:30pm ET, market still open

permissions:
  contents: write  # allows the commit steps

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train Iris model
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python train_model.py

      - name: Cross-check price feeds
        env:
          API_KEY: ${{ secrets.API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python cross_check.py

      - name: Train stock trading model
        env:
          API_KEY: ${{ secrets.API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: python stock_model.py

      - name: Continuous training + strategy gate + learning archive
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          WINDOW_SIZE: "30"
          ROTATE_EVERY_DAYS: "7"
        run: python continuous_train.py

      - name: Paper trade portfolio (live on Alpaca paper, rotating universe)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          WINDOW_SIZE: "30"
          ROTATE_EVERY_DAYS: "7"
          TOP_N: "3"
        run: python paper_trading.py

      - name: Commit track record + training artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add track_record.csv metrics.json LEARNING.md strategy_state.json data/ models/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: daily training + track record $(date -u +'%F %H:%M UTC')"
            git push
          fi
