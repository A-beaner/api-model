name: train-model

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"  # weekdays 22:00 UTC, after US market close

permissions:
  contents: write  # allows the track-record / stop-state / memory commit step

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train Iris model
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python train_model.py

      - name: Cross-check price feeds
        env:
          API_KEY: ${{ secrets.API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python cross_check.py

      - name: Train stock trading model
        env:
          API_KEY: ${{ secrets.API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: python stock_model.py

      - name: Paper trade portfolio (live on Alpaca paper, rotating universe)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          WINDOW_SIZE: "30"
          ROTATE_EVERY_DAYS: "7"
          TOP_N: "3"
          # Trading limits (plan to trade with less than $100,000)
          MAX_PORTFOLIO_VALUE: "100000"
          MAX_TRADE_VALUE: "50000"
          MIN_CASH_PCT: "0.05"
          # Trailing stop-loss (dollars below position peak)
          STOP_LOSS_DROP: "3.0"
          STATE_FILE: "stop_state.json"
          # Outcome feedback (learn from past mistakes)
          MODEL_MEMORY_FILE: "model_memory.csv"
          PERFORMANCE_WEIGHT: "1.0"
          MEMORY_WINDOW: "10"
          # Algorithm tuning
          MIN_SCORE: "0.55"
          TAKE_PROFIT_PCT: "0.15"
          MAX_DAILY_VOL: "0.04"
        run: python paper_trading.py

      - name: Commit track record and bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files=""
          [ -f track_record.csv ] && files="track_record.csv"
          [ -f stop_state.json ] && files="$files stop_state.json"
          [ -f model_memory.csv ] && files="$files model_memory.csv"
          if [ -n "$files" ]; then
            git add $files
            if git diff --cached --quiet; then
              echo "no track record / state changes"
            else
              git commit -m "chore: track record + stop/learning state $(date -u +'%F %H:%M UTC')"
              git push
            fi
          else
            echo "no track record or state files"
          fi
