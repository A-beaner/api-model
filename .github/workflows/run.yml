name: train-model

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * 1-5"  # weekdays 22:00 UTC, after US market close

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train Iris model
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: python train_model.py

      - name: Cross-check price feeds
        env:
          API_KEY: ${{ secrets.API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python cross_check.py

      - name: Train stock trading model
        env:
          API_KEY: ${{ secrets.API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
        run: python stock_model.py

      - name: Paper trade (dry-run until ALPACA secrets are set)
        env:
          API_KEY: ${{ secrets.API_KEY }}
          STOCK_API_KEY: ${{ secrets.STOCK_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python paper_trading.py
